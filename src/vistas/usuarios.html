<div id="section-usuarios" class="tab-section active">
  <div class="section-header" style="display: flex; justify-content: space-between; align-items: center;">
    <div>
      <p class="section-description">Gestión de clientes, suscripciones por fecha/hora y permisos de grupo (Packs).</p>
    </div>
    <div>
      <input 
        type="text" 
        id="buscar-usuario" 
        class="form-input" 
        placeholder="🔍 Buscar clientes..." 
        onkeyup="filtrarUsuarios(this.value)" 
        style="max-width: 320px;" 
      />
    </div>
  </div>

  <!-- Tabla de Usuarios / Clientes -->
  <div class="table-wrapper">
    <table class="data-table">
      <thead>
        <tr>
          <th>Usuario</th>
          <th>Suscripción</th>
          <th>Grupos Permitidos (Packs)</th>
          <th>Contraseña</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tabla-usuarios-body">
        <!-- Carga dinámica -->
      </tbody>
    </table>
  </div>

  <!-- Contenedor de Paginación -->
  <div class="pagination-bar" style="display: flex; justify-content: space-between; align-items: center; margin-top: 16px; font-size: 12px; color: var(--text-muted);">
    <span id="paginacion-info-usuarios">Página 1 de 1</span>
    <div style="display: flex; gap: 8px;">
      <button type="button" class="btn-secondary" style="padding: 4px 12px; font-size: 11px;" onclick="paginaAnteriorUsuarios()">Anterior</button>
      <button type="button" class="btn-secondary" style="padding: 4px 12px; font-size: 11px;" onclick="paginaSiguienteUsuarios()">Siguiente</button>
    </div>
  </div>
</div>

<!-- MODAL CREACIÓN / EDICIÓN DE CLIENTE -->
<div id="modal-nuevo-cliente" class="modal-overlay" style="display: none;">
  <div class="modal-content" style="max-width: 520px;">
    <div class="modal-header">
      <h3 class="modal-title" id="modal-cliente-titulo">Crear Nuevo Cliente</h3>
      <button class="modal-close" type="button" onclick="cerrarModalCliente()">&times;</button>
    </div>

    <form id="form-nuevo-cliente" onsubmit="guardarCliente(event)">
      <input type="hidden" id="modal-cliente-id" value="" />

      <div class="grid-2-col" style="margin-bottom: 0;">
        <div class="form-group">
          <label for="modal-cliente-usuario">Nombre de Usuario *</label>
          <input 
            type="text" 
            id="modal-cliente-usuario" 
            class="form-input" 
            placeholder="ej. juanperez" 
            required 
          />
          <input type="hidden" id="modal-cliente-rol" value="cliente" />
        </div>

        <div class="form-group">
          <label for="modal-cliente-password">Contraseña *</label>
          <input 
            type="password" 
            id="modal-cliente-password" 
            class="form-input" 
            placeholder="••••••••" 
            required 
          />
        </div>
      </div>

      <div class="grid-2-col" style="margin-bottom: 0;">
        <div class="form-group">
          <label for="modal-usuario-plan">Plan de Suscripción *</label>
          <select id="modal-usuario-plan" class="form-input">
            <option value="Basic">Basic (Plan Básico)</option>
            <option value="Enterprise" selected>Enterprise (Plan Enterprise)</option>
            <option value="Premium">Premium (Plan Premium VIP)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="modal-cliente-tarifa">Tarifa Mensual Cobrada (S/ PEN)</label>
          <input 
            type="number" 
            step="0.01"
            min="0"
            id="modal-cliente-tarifa" 
            class="form-input" 
            placeholder="ej. 29.99" 
            value="29.99"
          />
        </div>
      </div>

      <h4 class="col-title" style="margin-top: 8px; margin-bottom: 8px;">Suscripción (Fecha y Hora Exacta)</h4>

      <div class="grid-2-col" style="margin-bottom: 4px;">
        <div class="form-group">
          <label for="modal-cliente-inicio">Fecha de Inicio</label>
          <input 
            type="datetime-local" 
            id="modal-cliente-inicio" 
            class="form-input" 
          />
        </div>

        <div class="form-group">
          <label for="modal-cliente-vencimiento">Fecha Vencimiento</label>
          <input 
            type="datetime-local" 
            id="modal-cliente-vencimiento" 
            class="form-input" 
          />
        </div>
      </div>

      <!-- Botones de Cálculo Rápido de Suscripción -->
      <div class="form-group" style="margin-bottom: 14px;">
        <label style="margin-bottom: 6px; font-size: 11px;">Cálculo Rápido de Vencimiento:</label>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <button type="button" class="btn-secondary" style="padding: 5px 10px; font-size: 11.5px;" onclick="sumarTiempoSuscripcion('horas', 1)">+ 1 Hora</button>
          <button type="button" class="btn-secondary" style="padding: 5px 10px; font-size: 11.5px;" onclick="sumarTiempoSuscripcion('horas', 3)">+ 3 Horas</button>
          <button type="button" class="btn-secondary" style="padding: 5px 10px; font-size: 11.5px;" onclick="sumarTiempoSuscripcion('dias', 1)">+ 1 Día</button>
          <button type="button" class="btn-secondary" style="padding: 5px 10px; font-size: 11.5px;" onclick="sumarTiempoSuscripcion('meses', 1)">+ 1 Mes</button>
        </div>
      </div>

      <div class="form-group">
        <label style="margin-bottom: 8px;">Grupos de Perfiles Permitidos (Packs)</label>
        <div id="lista-grupos-permitidos" style="display: flex; gap: 8px; flex-wrap: wrap; padding: 4px 0;">
          <!-- Carga dinámica de Píldoras Interactivas -->
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" onclick="cerrarModalCliente()">Cancelar</button>
        <button type="submit" id="btn-guardar-cliente" class="btn-submit">Guardar Cliente</button>
      </div>
    </form>
  </div>
</div>
